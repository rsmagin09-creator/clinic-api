<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Врачи и записи — Запись в поликлинику</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="logo">🏥 Поликлиника</div><nav><a href="index.html">Врачи</a></nav><div id="user-box"></div></header>
<main>
  <div class="card" id="my-card" hidden>
    <h2 id="my-title">Мои записи на приём</h2>
    <table>
      <thead><tr><th>Дата</th><th>Время</th><th id="col-person">Врач</th><th>Кабинет</th><th>Причина</th><th>Статус</th></tr></thead>
      <tbody id="my-rows"><tr><td colspan="6" class="muted">Загрузка…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Врачи поликлиники</h2>
    <table>
      <thead><tr><th>ФИО</th><th>Специальности</th><th>Кабинет</th><th>Стаж</th><th>О враче</th></tr></thead>
      <tbody id="doctor-rows"><tr><td colspan="5" class="muted">Загрузка…</td></tr></tbody>
    </table>
    <p class="muted" id="doctor-meta"></p>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function loadDoctors() {
    const res = await api('GET', '/doctors?per_page=20&sort=name');
    const tbody = document.getElementById('doctor-rows');
    if (!res.ok) { tbody.innerHTML = `<tr><td colspan="5" class="alert">${esc(res.message)}</td></tr>`; return; }
    tbody.innerHTML = res.data.data.map(d => `<tr>
      <td><b>${esc(d.name)}</b></td>
      <td>${d.specialties.map(s => `<span class="tag">${esc(s.name)}</span>`).join('')}</td>
      <td>${esc(d.cabinet)}</td><td>${d.experience_years} лет</td><td class="muted">${esc(d.description ?? '—')}</td>
    </tr>`).join('');
    document.getElementById('doctor-meta').textContent =
      `Всего врачей: ${res.data.meta.total}, страница ${res.data.meta.current_page} из ${res.data.meta.last_page}`;
  }

  async function loadMyAppointments(user) {
    document.getElementById('my-card').hidden = false;
    if (user.role === 'doctor') { document.getElementById('my-title').textContent = 'Мои приёмы'; document.getElementById('col-person').textContent = 'Пациент'; }
    if (user.role === 'admin') { document.getElementById('my-title').textContent = 'Все записи на приём'; }
    const res = await api('GET', '/appointments?sort=date&order=desc&per_page=10');
    const tbody = document.getElementById('my-rows');
    if (!res.ok) { tbody.innerHTML = `<tr><td colspan="6" class="alert">${esc(res.message)}</td></tr>`; return; }
    if (!res.data.data.length) { tbody.innerHTML = '<tr><td colspan="6" class="muted">Записей пока нет</td></tr>'; return; }
    tbody.innerHTML = res.data.data.map(a => `<tr>
      <td>${a.date.split('-').reverse().join('.')}</td><td>${a.time}</td>
      <td>${esc(user.role === 'doctor' ? a.patient?.name : a.doctor?.name)}</td>
      <td>${esc(a.doctor?.cabinet)}</td><td>${esc(a.reason ?? '—')}</td>
      <td class="status-${a.status}">${esc(a.status_label)}</td></tr>`).join('');
  }

  (async () => {
    const user = await renderHeader();
    if (user) loadMyAppointments(user);
    loadDoctors();
  })();
</script>
</body>
</html>
