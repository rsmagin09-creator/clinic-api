<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Врачи — Запись в поликлинику</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><div class="logo">🏥 Поликлиника</div><nav></nav><div id="user-box"></div></header>
<main>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2>Врачи поликлиники</h2>
      <a class="btn primary-sm" href="doctor-form.html" data-role="admin" hidden>+ Добавить врача</a>
    </div>
    <form class="filters" id="filters">
      <div><label>Поиск по ФИО или кабинету</label><input name="search" placeholder="Например: Иванов"></div>
      <div><label>Специальность</label><select name="specialty_id"><option value="">Все</option></select></div>
      <div><label>Стаж от, лет</label><input name="experience_min" type="number" min="0"></div>
      <div><label>Сортировка</label><select name="sort">
        <option value="name">По ФИО</option><option value="experience_years">По стажу</option><option value="cabinet">По кабинету</option><option value="price">По цене приёма</option></select></div>
      <div><label>Порядок</label><select name="order"><option value="asc">↑</option><option value="desc">↓</option></select></div>
      <div><button class="btn primary-sm" type="submit">Найти</button></div>
    </form>
    <table>
      <thead><tr><th>ФИО</th><th>Специальности</th><th>Кабинет</th><th>Стаж</th><th>Приём</th><th>О враче</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted">Загрузка…</td></tr></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script>
<script>
  let user = null, page = 1;
  const form = document.getElementById('filters');

  async function loadSpecialties() {
    const res = await api('GET', '/specialties');
    if (res.ok) form.specialty_id.innerHTML += res.data.data.map(s => `<option value="${s.id}">${esc(s.name)} (${s.doctors_count})</option>`).join('');
  }

  async function load() {
    const params = { ...Object.fromEntries(new FormData(form)), page, per_page: 5 };
    const res = await api('GET', '/doctors?' + qs(params));
    const tbody = document.getElementById('rows');
    if (!res.ok) { tbody.innerHTML = `<tr><td colspan="7"><div class="alert">${esc(res.message)}</div></td></tr>`; return; }
    if (!res.data.data.length) tbody.innerHTML = '<tr><td colspan="7" class="muted">Ничего не найдено</td></tr>';
    else tbody.innerHTML = res.data.data.map(d => `<tr>
      <td><a href="doctor.html?id=${d.id}"><b>${esc(d.name)}</b></a></td>
      <td>${d.specialties.map(s => `<span class="tag">${esc(s.name)}</span>`).join('')}</td>
      <td>${esc(d.cabinet)}</td><td>${d.experience_years} лет</td><td style="white-space:nowrap"><b>${tenge(d.price)}</b></td><td class="muted">${esc(d.description ?? '—')}</td>
      <td style="white-space:nowrap">
        <a class="btn" href="doctor.html?id=${d.id}">${user?.role === 'patient' ? 'Записаться' : 'Подробнее'}</a>
        ${user?.role === 'admin' ? `<a class="btn" href="doctor-form.html?id=${d.id}">Изменить</a>
          <button class="btn danger" data-del="${d.id}" data-name="${esc(d.name)}">Удалить</button>` : ''}
      </td></tr>`).join('');
    renderPager(document.getElementById('pager'), res.data.meta, p => { page = p; load(); });
    tbody.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeDoctor(b.dataset.del, b.dataset.name));
  }

  async function removeDoctor(id, name) {
    if (!confirm(`Удалить врача «${name}»? Действие нельзя отменить.`)) return;
    const res = await api('DELETE', '/doctors/' + id);
    if (res.ok) { toast('Врач удалён'); load(); } else toast(res.message, 'err');
  }

  form.onsubmit = e => { e.preventDefault(); page = 1; load(); };
  form.sort.onchange = form.order.onchange = form.specialty_id.onchange = () => { page = 1; load(); };

  (async () => { user = await renderHeader(); await loadSpecialties(); load(); })();
</script>
</body>
</html>
